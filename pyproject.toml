[project]
name = "bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "environs>=15.2.0",
    "python-telegram-bot==13.15",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "setuptools<81",
]

[project.scripts]
bot = "bot:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]
